<!doctype html>
<html lang="th" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ITMAINT Users RBAC</title>
    <link rel="stylesheet" href="../../assets/hark.css" />
    <style>
      :root { color-scheme: dark; --sans: "Noto Sans Thai", "Geist", -apple-system, "Segoe UI", Tahoma, sans-serif;
        --x-bg: #0a1024; --x-card: #0f1733; --x-card2: #141e42; --x-line: rgb(77 124 255 / .30); --x-line2: rgb(120 150 255 / .14);
        --x-text: #e8ecf8; --x-muted: #a3aed0; --x-blue: #4d7cff; --x-glow: 0 0 0 1px rgb(77 124 255 / .10), 0 0 22px rgb(56 110 255 / .14);
        --x-primary: linear-gradient(135deg, #c2410c, #be185d); }
      html, body { background: var(--x-bg); color: var(--x-text); }
      body { font: var(--type-body); overflow-x: hidden; }
      .x-app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
      .x-side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: #0b1230; border-right: 1px solid var(--x-line2); padding: 16px 12px 24px; }
      .x-logo { display: flex; gap: 10px; align-items: center; padding: 4px 8px 16px; }
      .x-logo b { display: block; font: var(--weight-bold) 20px/1.1 var(--sans); letter-spacing: .3px; }
      .x-logo small { color: var(--x-muted); font-size: 12px; }
      .x-grp { font: var(--type-tag); color: var(--x-muted); padding: 14px 10px 4px; }
      .x-nav a { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: var(--r-s); text-decoration: none; color: #c9d2ee; font: var(--type-small); }
      .x-nav a:hover { background: rgb(77 124 255 / .10); }
      .x-nav a.on { background: linear-gradient(90deg, #2c5bf0, #3a6cff); color: #fff; box-shadow: 0 0 18px rgb(58 108 255 / .45); }
      .x-nav svg { width: 18px; height: 18px; flex: none; }
      .x-top { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; padding: 12px var(--gutter); background: rgb(10 16 36 / .88); backdrop-filter: var(--hark-blur); border-bottom: 1px solid var(--x-line2); }
      .x-in, .x-sel { min-height: 44px; background: var(--x-card); border: 1px solid var(--x-line); border-radius: var(--r-s); color: var(--x-text); font: var(--type-small); padding: 0 12px; min-width: 0; }
      .x-sel { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--x-muted) 50%), linear-gradient(135deg, var(--x-muted) 50%, transparent 50%); background-position: right 16px center, right 11px center; background-size: 5px 5px; background-repeat: no-repeat; }
      .x-in:focus, .x-sel:focus { outline: 2px solid var(--x-blue); outline-offset: 1px; }
      .x-search { flex: 1; position: relative; max-width: 520px; display: flex; min-width: 0; }
      .x-search .x-in { width: 100%; }
      .x-search .x-in { flex: 1; padding-left: 38px; padding-right: 64px; }
      .x-search > svg { position: absolute; left: 12px; top: 13px; width: 18px; height: 18px; color: var(--x-muted); }
      .x-kbd { position: absolute; right: 8px; top: 10px; font: var(--type-caption); border: 1px solid var(--x-line); border-radius: 6px; padding: 2px 6px; color: var(--x-muted); }
      .x-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: var(--r-s); border: 1px solid var(--x-line); background: var(--x-card); color: var(--x-text); font: var(--type-label); cursor: pointer; white-space: nowrap; text-decoration: none; }
      .x-btn:hover { border-color: var(--x-blue); }
      .x-btn:disabled { opacity: .38; cursor: not-allowed; border-color: var(--x-line2); }
      .x-btn svg { width: 18px; height: 18px; }
      .x-pri { background: var(--x-primary); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgb(190 24 93 / .35); }
      .x-ico { padding: 0; position: relative; }
      .x-badge { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: #e11d48; color: #fff; font: 600 12px/16px var(--sans); padding: 0 3px; }
      .x-me { display: flex; align-items: center; gap: 8px; font: var(--type-label); }
      .x-me small { display: block; color: var(--x-muted); font: var(--type-caption); }
      .x-av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font: 600 13px/1 var(--sans); }
      .x-main { padding: 20px var(--gutter) 40px; display: grid; gap: 16px; min-width: 0; align-content: start; }
      .x-card { background: linear-gradient(180deg, var(--x-card2), var(--x-card)); border: 1px solid var(--x-line); border-radius: var(--r-m); box-shadow: var(--x-glow); padding: 16px; min-width: 0; }
      .x-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .x-ph { justify-content: space-between; }
      .x-ph h1 { font: var(--type-title); font-weight: 600; }
      .x-ph p { color: var(--x-muted); font: var(--type-small); }
      .x-tabs { display: flex; gap: 4px; padding: 4px; background: var(--x-card); border: 1px solid var(--x-line2); border-radius: var(--r-s); width: max-content; max-width: 100%; overflow-x: auto; }
      .x-tabs button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 9px; background: none; color: var(--x-muted); font: var(--type-label); cursor: pointer; white-space: nowrap; }
      .x-tabs button[aria-selected="true"] { background: linear-gradient(90deg, #2c5bf0, #3a6cff); color: #fff; }
      .x-tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
      .x-tile svg { width: 20px; height: 20px; }
      .g1 { background: linear-gradient(135deg, #3b82f6, #7c3aed); } .g2 { background: linear-gradient(135deg, #f97316, #db2777); }
      .g3 { background: linear-gradient(135deg, #10b981, #0e7490); } .g4 { background: linear-gradient(135deg, #a855f7, #db2777); }
      .g5 { background: linear-gradient(135deg, #06b6d4, #2563eb); } .g6 { background: linear-gradient(135deg, #f59e0b, #dc2626); }
      .x-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .x-kpi { display: flex; gap: 12px; align-items: center; }
      .x-kpi > div { min-width: 0; overflow-wrap: anywhere; }
      .x-kpi b { display: block; font: var(--type-figure); font-weight: 600; }
      .x-kpi span { color: var(--x-muted); font: var(--type-small); }
      .x-filters { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 12px; }
      .x-user { display: flex; gap: 10px; align-items: center; }
      .x-user small { color: var(--x-muted); }
      .x-role { display: inline-block; padding: 4px 10px; border-radius: var(--r-pill); font: var(--type-tag); background: rgb(77 124 255 / .14); border: 1px solid rgb(77 124 255 / .4); color: #c7d5ff; }
      .x-role.r0 { background: rgb(219 39 119 / .15); border-color: rgb(244 114 182 / .45); color: #fbcfe8; }
      .x-role.r5 { background: rgb(249 115 22 / .14); border-color: rgb(251 146 60 / .45); color: #fed7aa; }
      .x-st { display: inline-flex; align-items: center; gap: 6px; font: var(--type-tag); }
      .x-st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
      .x-st.off::before { background: #f59e0b; box-shadow: none; } .x-st.lock::before { background: #ef4444; box-shadow: none; }
      .x-on { color: #4ade80; }
      .x-acts { display: flex; gap: 4px; }
      .x-acts .x-btn { background: transparent; }
      #utable td, #utable th { vertical-align: middle; }
      .x-rbac { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
      .x-roles { display: grid; gap: 8px; }
      .x-rc { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 12px; text-align: left; border-radius: var(--r-s); border: 1px solid var(--x-line2); background: var(--x-card); color: var(--x-text); font: var(--type-label); cursor: pointer; }
      .x-rc.on { border-color: var(--x-blue); box-shadow: 0 0 16px rgb(77 124 255 / .35); background: #1a2a5e; color: #fff; }
      .x-rc.on em { color: #dbe4ff; }
      .x-rc .x-tile { width: 34px; height: 34px; border-radius: 10px; }
      .x-rc em { margin-left: auto; font-style: normal; color: var(--x-muted); font: var(--type-caption); white-space: nowrap; }
      .x-rname { font: var(--type-heading); font-weight: 600; background: transparent; border: 1px solid transparent; color: var(--x-text); border-radius: 8px; padding: 4px 6px; margin-left: -6px; width: 100%; min-height: 44px; }
      .x-rname:hover, .x-rname:focus { border-color: var(--x-line); outline: 0; }
      .x-mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; margin-top: 14px; }
      .x-mod { border: 1px solid var(--x-line2); border-radius: var(--r-s); padding: 10px 12px 12px; background: rgb(10 16 36 / .45); }
      .x-mh { display: flex; align-items: center; gap: 10px; min-height: 44px; font: var(--type-label); cursor: pointer; }
      .x-mh em { margin-left: auto; font-style: normal; color: var(--x-muted); font: var(--type-caption); }
      .x-mh input { width: 20px; height: 20px; accent-color: var(--x-blue); }
      .x-perms { display: flex; flex-wrap: wrap; gap: 6px; }
      .x-sw { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--x-line2); font: var(--type-small); cursor: pointer; color: var(--x-muted); }
      .x-sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .x-sw i { width: 30px; height: 18px; border-radius: 9px; background: #2a345a; position: relative; transition: background var(--dur-quick); flex: none; }
      .x-sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #c9d2ee; transition: transform var(--dur-quick) var(--ease-out); }
      .x-sw:has(input:checked) { color: var(--x-text); border-color: rgb(77 124 255 / .5); }
      .x-sw input:checked + i { background: var(--x-blue); } .x-sw input:checked + i::after { transform: translateX(12px); background: #fff; }
      .x-sw:has(input:focus-visible) { outline: 2px solid var(--x-blue); }
      dialog { background: var(--x-card); color: var(--x-text); border: 1px solid var(--x-line); border-radius: var(--r-m); box-shadow: var(--x-glow), 0 20px 60px #000a; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
      dialog::backdrop { background: rgb(4 8 22 / .72); backdrop-filter: blur(4px); }
      dialog form { padding: 20px; display: grid; gap: 14px; }
      .x-fg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .x-fg label { display: grid; gap: 6px; font: var(--type-tag); color: var(--x-muted); }
      .x-toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 50; background: #111a3a; border: 1px solid rgb(74 222 128 / .5); color: var(--x-text); padding: 12px 18px; border-radius: var(--r-s); box-shadow: 0 0 22px rgb(34 197 94 / .25); font: var(--type-label); transition: all var(--dur-quick) var(--ease-out); max-width: calc(100vw - 32px); }
      .x-toast.show { opacity: 1; transform: translate(-50%, 0); }
      .x-menu { display: none; }
      [hidden] { display: none !important; }
      @media (max-width: 1080px) { .x-rbac { grid-template-columns: minmax(0, 1fr); } .x-roles { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
      @media (max-width: 900px) {
        .x-app { grid-template-columns: minmax(0, 1fr); }
        .x-side { position: fixed; z-index: 30; left: 0; width: 272px; transform: translateX(-100%); transition: transform var(--dur-quick) var(--ease-out); }
        .x-side.open { transform: none; box-shadow: 0 0 60px #000c; }
        .x-menu { display: inline-flex; }
        .x-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .x-hide-m { display: none !important; }
      }
      @media (max-width: 599px) {
        .x-filters, .x-fg { grid-template-columns: minmax(0, 1fr); }
        .x-top { gap: 6px; padding-inline: 10px; } .x-kbd, .x-me span { display: none; }
        .x-ph .x-pri { width: 100%; }
        #utable tbody tr { border-bottom: 1px solid var(--x-line2); }
        .x-roles { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <div class="x-app">
      <aside class="x-side" id="side" aria-label="เมนูหลัก">
        <div class="x-logo">
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><path d="M20 2l16 9v18l-16 9-16-9V11z" fill="url(#lg)"/><path d="M14 13h12v4h-4v10h-4V17h-4z" fill="#fff"/></svg>
          <div><b>IT&amp;MAINT</b><small>Smart Asset · Smart Work</small></div>
        </div>
        <nav class="x-nav" id="nav"></nav>
      </aside>
      <div style="min-width:0">
        <header class="x-top">
          <button class="x-btn x-ico x-menu" id="menuBtn" aria-label="เปิดเมนู"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <select class="x-sel x-hide-m" aria-label="เลือกไซต์"><option>ทุกไซต์</option><option>โรงงานสมุทรสาคร</option><option>โรงงานระยอง</option></select>
          <div class="x-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input class="x-in" id="gsearch" placeholder="ค้นหา Ticket / ทรัพย์สิน / ผู้ใช้ / เมนู..." aria-label="ค้นหา" /><span class="x-kbd">Ctrl + K</span></div>
          <button class="x-btn x-pri x-hide-m" data-toast="เปิดฟอร์มแจ้งซ่อม">+ แจ้งซ่อม</button>
          <button class="x-btn x-ico" aria-label="การแจ้งเตือน 3 รายการ" data-toast="มีการแจ้งเตือนใหม่ 3 รายการ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"/></svg><span class="x-badge">3</span></button>
          <div class="x-me"><span class="x-av g4">AD</span><span>Admin<small>ผู้ดูแลระบบสูงสุด</small></span></div>
        </header>
        <main class="x-main">
          <div class="x-row x-ph">
            <div><h1>ผู้ใช้งาน &amp; บทบาทสิทธิ์</h1><p>จัดการบัญชีผู้ใช้ บทบาท และสิทธิ์การเข้าถึงแต่ละโมดูล</p></div>
            <button class="x-btn x-pri" id="addBtn">+ เพิ่มผู้ใช้</button>
          </div>
          <div class="x-tabs" role="tablist">
            <button role="tab" aria-selected="true" aria-controls="tabUsers" id="t1">ผู้ใช้งาน</button>
            <button role="tab" aria-selected="false" aria-controls="tabRbac" id="t2">บทบาท &amp; สิทธิ์ (RBAC)</button>
          </div>

          <section id="tabUsers" role="tabpanel" aria-labelledby="t1" style="display:grid;gap:16px">
            <div class="x-kpis" id="kpis"></div>
            <div class="x-card">
              <div class="x-filters">
                <input class="x-in" id="fq" placeholder="ค้นหา ชื่อผู้ใช้ / ชื่อ / อีเมล / รหัสพนักงาน" aria-label="ค้นหาผู้ใช้" />
                <select class="x-sel" id="frole" aria-label="บทบาท"></select>
                <select class="x-sel" id="fst" aria-label="สถานะ"><option value="">ทุกสถานะ</option><option>ใช้งาน</option><option>ระงับ</option><option>ถูกล็อก</option></select>
              </div>
              <div class="table-wrap">
                <table id="utable">
                  <thead><tr><th scope="col">ผู้ใช้</th><th scope="col">แผนก/ไซต์ · ตำแหน่ง</th><th scope="col">บทบาท</th><th scope="col">ขอบเขตข้อมูล</th><th scope="col">เข้าใช้ล่าสุด</th><th scope="col">สถานะ</th><th scope="col">การจัดการ</th></tr></thead>
                  <tbody id="ubody"></tbody>
                </table>
              </div>
            </div>
          </section>

          <section id="tabRbac" role="tabpanel" aria-labelledby="t2" hidden>
            <div class="x-rbac">
              <div class="x-card">
                <div class="x-row x-ph" style="margin-bottom:12px"><b>บทบาท (<span id="rcount">11</span>)</b><button class="x-btn" id="newRole">+ สร้างบทบาท</button></div>
                <div class="x-roles" id="roles"></div>
              </div>
              <div class="x-card">
                <div class="x-row x-ph">
                  <div style="flex:1;min-width:220px"><input class="x-rname" id="rname" aria-label="ชื่อบทบาท" /><p class="x-muted" id="rdesc" style="color:var(--x-muted);font:var(--type-small)"></p></div>
                  <div class="x-row"><button class="x-btn" id="selAll">เลือกทั้งหมด</button><button class="x-btn" id="clrAll">ล้าง</button><button class="x-btn x-pri" id="savePerm">บันทึกสิทธิ์</button></div>
                </div>
                <p style="color:var(--x-muted);font:var(--type-caption);margin-top:8px" id="pcount"></p>
                <div class="x-mods" id="mods"></div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <dialog id="dlg" aria-labelledby="dlgTitle">
      <form method="dialog" id="uform">
        <div class="x-row x-ph"><h2 id="dlgTitle" style="font:var(--type-heading);font-weight:600">เพิ่มผู้ใช้</h2><button class="x-btn x-ico" value="cancel" formnovalidate aria-label="ปิด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="x-fg" id="fields">
          <label>ชื่อ-สกุล<input class="x-in" name="name" required /></label>
          <label>Username<input class="x-in" name="user" required pattern="[A-Za-z0-9._\-]+" /></label>
          <label>อีเมล<input class="x-in" name="email" type="email" /></label>
          <label>รหัสพนักงาน<input class="x-in" name="emp" /></label>
          <label>แผนก<input class="x-in" name="dept" /></label>
          <label>ไซต์<select class="x-sel" name="site"><option>โรงงานสมุทรสาคร</option><option>โรงงานระยอง</option></select></label>
          <label>ตำแหน่ง<input class="x-in" name="pos" /></label>
          <label>บทบาท<select class="x-sel" name="role" id="frm-role"></select></label>
          <label>ขอบเขตข้อมูล<select class="x-sel" name="scope"><option>ทั้งหมด</option><option>ไซต์ของตน</option><option>เฉพาะที่ถือครอง</option></select></label>
          <label>LINE / Telegram ผูกบัญชี<select class="x-sel" name="bind"><option>ยังไม่ผูก</option><option>LINE</option><option>Telegram</option><option>LINE + Telegram</option></select></label>
        </div>
        <div class="x-row x-ph"><button type="button" class="x-btn" id="addField">+ เพิ่มฟิลด์</button>
          <div class="x-row"><button class="x-btn" value="cancel" formnovalidate>ยกเลิก</button><button class="x-btn x-pri" value="ok" id="saveUser">บันทึก</button></div></div>
      </form>
    </dialog>
    <div class="x-toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../../assets/hark.js"></script>
    <script>
      (function () {
        var $ = function (s) { return document.querySelector(s); };
        var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

            return '<div class="x-mod"><label class="x-mh"><input type="checkbox" data-g="' + m.k + '"' + (on === m.p.length ? " checked" : "") + (on && on < m.p.length ? ' data-ind="1"' : "") + " />" + m.n + "<em>" + on + "/" + m.p.length + '</em></label><div class="x-perms">' +
              m.p.map(function (p, i) { var id = m.k + "." + i; return '<label class="x-sw"><input type="checkbox" data-p="' + id + '"' + (r.perms.has(id) ? " checked" : "") + ' aria-label="' + m.n + ": " + p + '" /><i></i>' + p + "</label>"; }).join("") + "</div></div>"; }).join("");
          [].slice.call(document.querySelectorAll("[data-ind]")).forEach(function (c) { c.indeterminate = true; });
        }
        $("#roles").addEventListener("click", function (e) { var b = e.target.closest("[data-r]"); if (!b) return; cur = +b.dataset.r; renderRoles(); renderPerms(); });
        $("#mods").addEventListener("change", function (e) { var t = e.target, r = roles[cur];
          if (t.dataset.p) { t.checked ? r.perms.add(t.dataset.p) : r.perms.delete(t.dataset.p); }
          if (t.dataset.g) { var m = MODS.filter(function (x) { return x.k === t.dataset.g; })[0]; m.p.forEach(function (_, i) { t.checked ? r.perms.add(m.k + "." + i) : r.perms.delete(m.k + "." + i); }); }
          renderPerms(); var el = document.querySelector('[data-p="' + t.dataset.p + '"],[data-g="' + t.dataset.g + '"]'); if (el) el.focus();
        });
        $("#rname").addEventListener("change", function () { var v = this.value.trim(); if (v) { roles[cur].n = v; renderRoles(); fillSelects(); renderUsers(); } });
        $("#selAll").addEventListener("click", function () { roles[cur].perms = new Set(ALL); renderPerms(); });
        $("#clrAll").addEventListener("click", function () { roles[cur].perms = new Set(); renderPerms(); });
        $("#savePerm").addEventListener("click", function () { toast("บันทึก " + roles[cur].perms.size + " สิทธิ์ ให้บทบาท " + roles[cur].n); });
        $("#newRole").addEventListener("click", function () { roles.push({ n: "บทบาทใหม่ " + (roles.length - 10), d: "บทบาทที่สร้างเอง เริ่มจากสิทธิ์ดูภาพรวม", g: grads[roles.length % 6], perms: new Set(["ov.0"]) });
          cur = roles.length - 1; renderRoles(); renderPerms(); fillSelects(); toast("สร้างบทบาทใหม่แล้ว ตั้งชื่อได้ที่หัวข้อด้านขวา"); $("#rname").focus(); $("#rname").select(); });

        function showTab(n) { $("#t1").setAttribute("aria-selected", n === 1); $("#t2").setAttribute("aria-selected", n === 2); $("#tabUsers").hidden = n !== 1; $("#tabRbac").hidden = n !== 2;
          [].slice.call(document.querySelectorAll("#nav a")).forEach(function (a) { var on = a.dataset.go == n; a.classList.toggle("on", on); on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); }); }
        $("#t1").addEventListener("click", function () { showTab(1); }); $("#t2").addEventListener("click", function () { showTab(2); });
        $(".x-tabs").addEventListener("keydown", function (e) { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { var n = $("#t1").getAttribute("aria-selected") === "true" ? 2 : 1; showTab(n); $("#t" + n).focus(); } });
        $("#nav").addEventListener("click", function (e) { var a = e.target.closest("a"); if (!a) return; e.preventDefault(); $("#side").classList.remove("open");
          if (a.dataset.go) showTab(+a.dataset.go); else toast("เปิดเมนู " + a.textContent + " (ตัวอย่าง)"); });
        $("#menuBtn").addEventListener("click", function () { $("#side").classList.toggle("open"); });

        fillSelects(); renderUsers(); renderRoles(); renderPerms();
      })();
    </script>
      <script src="../../assets/site-nav.js"></script>
</body>
