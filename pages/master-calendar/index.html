<!doctype html>
<html lang="th" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ITMAINT Master Calendar</title>
    <link rel="stylesheet" href="../../assets/hark.css" />
    <style>
      :root { --x-bg:#0A1024; --x-card:#0F1733; --x-card2:#131C3A; --x-line:rgba(77,141,255,.32); --x-glow:0 0 0 1px rgba(77,141,255,.06),0 0 18px rgba(56,120,255,.14); --x-tx:#E6ECFF; --x-mut:#9AA6C8; --x-r:16px; color-scheme:dark; }
      body { background:var(--x-bg); color:var(--x-tx); font:400 14px/1.5 "Noto Sans Thai",sans-serif; }
      button,input,select { font:inherit; color:inherit; }
      .x-app { display:grid; grid-template-columns:248px minmax(0,1fr); min-height:640px; }
      .x-side { background:#0B1330; border-right:1px solid var(--x-line); padding:18px 14px; }
      .x-logo { display:flex; gap:10px; align-items:center; padding:4px 6px 18px; }
      .x-logo b { display:block; font-size:16px; } .x-logo small { color:var(--x-mut); font-size:12px; }
      .x-tile { flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg,#3B82F6,#8B5CF6); box-shadow:0 0 14px rgba(99,102,241,.4); }
      .x-tile svg { width:20px; height:20px; }
      .x-grp { margin:14px 6px 6px; font-size:12px; color:var(--x-mut); letter-spacing:.04em; }
      .x-nav a { display:flex; align-items:center; gap:10px; min-height:44px; padding:0 10px; border-radius:12px; color:#C9D3F0; text-decoration:none; }
      .x-nav a:hover { background:var(--x-card2); }
      .x-nav a.on { background:linear-gradient(90deg,rgba(59,130,246,.28),rgba(139,92,246,.14)); color:#fff; box-shadow:inset 0 0 0 1px var(--x-line); }
      .x-nav svg { width:18px; height:18px; flex:none; }
      .x-main { padding:16px 20px 32px; min-width:0; }
      .x-top { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
      .x-in, .x-sel { min-height:44px; background:var(--x-card2); border:1px solid var(--x-line); border-radius:12px; padding:0 12px; }
      .x-search { flex:1 1 200px; display:flex; align-items:center; gap:8px; } .x-search input { flex:1; min-width:0; }
      .x-ib { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--x-card2); border:1px solid var(--x-line); cursor:pointer; position:relative; }
      .x-ib svg { width:20px; height:20px; }
      .x-badge { position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%; background:#F43F5E; }
      .x-btn { min-height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--x-line); background:var(--x-card2); cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
      .x-btn:hover { border-color:#4D8DFF; }
      .x-pri { background:linear-gradient(135deg,#C2410C,#BE185D); border-color:transparent; color:#fff; font-weight:600; box-shadow:0 4px 18px rgba(190,24,93,.3); }
      .x-ava { display:flex; align-items:center; gap:8px; min-height:44px; }
      .x-ava span { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-weight:600; background:linear-gradient(135deg,#0EA5E9,#6366F1); }
      .x-menu { display:none; }
      .x-card { background:var(--x-card); border:1px solid var(--x-line); border-radius:var(--x-r); box-shadow:var(--x-glow); padding:16px; min-width:0; }
      .x-ph { display:flex; gap:12px; align-items:center; margin-bottom:14px; }
      .x-ph h1 { font-size:22px; line-height:1.3; } .x-ph p { color:var(--x-mut); font-size:13px; }
      .x-body { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
      .x-ctl { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
      .x-ctl h2 { font-size:18px; margin-right:auto; min-width:150px; }
      .x-seg { display:inline-flex; background:var(--x-card2); border:1px solid var(--x-line); border-radius:12px; padding:2px; }
      .x-seg button { min-height:44px; min-width:44px; padding:0 12px; border:0; background:none; border-radius:10px; cursor:pointer; color:var(--x-mut); }
      .x-seg button[aria-pressed="true"] { background:#1E2A55; color:#fff; }
      .x-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
      .x-chip { min-height:44px; display:inline-flex; align-items:center; gap:7px; padding:0 12px; border-radius:999px; background:#121A36; border:1px solid #233063; cursor:pointer; font-size:13px; }
      .x-chip i { width:9px; height:9px; border-radius:50%; background:var(--c); }
      .x-chip b { font-size:12px; background:#1E2A55; border-radius:999px; padding:0 7px; }
      .x-chip[aria-pressed="false"] { opacity:.45; } .x-chip[aria-pressed="false"] i { background:none; box-shadow:inset 0 0 0 2px var(--c); }
      .x-dow, .x-week { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
      .x-dow span { text-align:center; font-size:12px; color:var(--x-mut); padding:6px 0; }
      .x-week { border-top:1px solid #1C2650; }
      .x-day { grid-row:1/-1; border-left:1px solid #1C2650; padding:4px 6px; min-height:112px; cursor:pointer; }
      .x-day:first-child { border-left:0; } .x-day:hover { background:rgba(77,141,255,.05); }
      .x-day.is-out .x-num { color:#4A5680; }
      .x-num { display:inline-grid; place-items:center; min-width:24px; height:24px; border-radius:50%; font-size:13px; }
      .is-today { background:rgba(59,130,246,.09); box-shadow:inset 0 0 0 1px #3B82F6; }
      .is-today .x-num { background:linear-gradient(135deg,#3B82F6,#8B5CF6); color:#fff; font-weight:600; }
      .x-dots { display:none; }
      .x-evs { display:flex; flex-direction:column; gap:3px; padding:0 4px 6px; min-width:0; pointer-events:none; }
      .x-evs > * { pointer-events:auto; }
      .x-bar { display:flex; align-items:center; gap:5px; width:100%; min-width:0; min-height:22px; padding:1px 6px; border-radius:6px; border:0; border-left:3px solid var(--c); background:color-mix(in srgb,var(--c) 20%,#0F1733); font-size:12px; text-align:left; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .x-bar:hover { background:color-mix(in srgb,var(--c) 34%,#0F1733); }
      .x-span { margin:2px 4px 1px; width:auto; z-index:1; }
      .x-more { border:0; background:none; color:#8FB4FF; font-size:12px; text-align:left; padding:0 4px; cursor:pointer; }
      .x-list .x-dg { padding:10px 0; border-top:1px solid #1C2650; display:grid; grid-template-columns:110px minmax(0,1fr); gap:10px; }
      .x-list .x-dg:first-child { border-top:0; }
      .x-dg h4 { font-size:13px; color:var(--x-mut); font-weight:500; } .x-dg h4 b { display:block; color:var(--x-tx); font-size:15px; }
      .x-dg.is-t h4 b { color:#8FB4FF; }
      .x-dg .x-bar, .x-ag .x-bar, .x-pop .x-bar { min-height:44px; white-space:normal; font-size:13px; border-radius:10px; }
      .x-dg > div, .x-ag > div { display:flex; flex-direction:column; gap:6px; min-width:0; }
      .x-empty { color:#9AA6C8; font-size:13px; padding:10px 0; }
      .x-ag h3 { font-size:16px; margin-bottom:4px; } .x-ag > p { color:var(--x-mut); font-size:12px; margin-bottom:10px; }
      .x-ag h4 { font-size:13px; color:var(--x-mut); font-weight:500; margin:12px 0 6px; }
      .x-bar small { display:block; color:var(--x-mut); font-size:12px; }
      .x-pop { position:fixed; right:20px; bottom:20px; width:340px; max-width:calc(100% - 24px); z-index:50; padding:18px; background:#111B3D; }
      .x-pop[hidden] { display:none; }
      .x-pop h3 { font-size:17px; margin:8px 40px 10px 0; }
      .x-pop dl { display:grid; grid-template-columns:72px 1fr; gap:6px; font-size:13px; margin:0 0 14px; } .x-pop dt { color:var(--x-mut); } .x-pop dd { margin:0; }
      .x-x { position:absolute; top:8px; right:8px; }
      .x-tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:3px 10px; border-radius:999px; background:#1A2448; }
      .x-tag i { width:8px; height:8px; border-radius:50%; background:var(--c); }
      dialog.x-card { color:var(--x-tx); width:380px; max-width:calc(100% - 24px); padding:20px; }
      dialog::backdrop { background:rgba(5,8,20,.7); }
      dialog label { display:block; font-size:13px; color:var(--x-mut); margin:12px 0 4px; } dialog .x-in, dialog .x-sel { width:100%; }
      .x-row { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
      .x-toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1A2448; border:1px solid var(--x-line); border-radius:12px; padding:12px 16px; z-index:60; box-shadow:var(--x-glow); max-width:calc(100% - 24px); }
      .x-toast[hidden] { display:none; }
      :focus-visible { outline:2px solid #8FB4FF; outline-offset:2px; }
      @media (max-width:1180px) { .x-body { grid-template-columns:minmax(0,1fr); } }
      @media (max-width:900px) {
        .x-app { grid-template-columns:minmax(0,1fr); }
        .x-side { position:fixed; top:0; bottom:0; left:0; width:270px; z-index:40; overflow-y:auto; transform:translateX(-100%); transition:transform .2s; }
        .x-side.open { transform:none; box-shadow:0 0 40px rgba(0,0,0,.6); }
        .x-menu { display:grid; } .x-ava em { display:none; }
        .x-main { padding:12px 12px 28px; }
      }
      @media (max-width:640px) {
        .x-card { padding:12px; }
        .x-evs, .x-span span { display:none; }
        .x-span { min-height:6px; height:6px; padding:0; margin:1px 0; border:0; background:var(--c); border-radius:3px; pointer-events:none; }
        .x-day { min-height:64px; padding:3px; text-align:center; }
        .x-dots { display:flex; flex-wrap:wrap; justify-content:center; gap:3px; margin-top:4px; }
        .x-dots i { width:6px; height:6px; border-radius:50%; background:var(--c); }
        .x-list .x-dg { grid-template-columns:minmax(0,1fr); gap:6px; }
        .x-top .x-sel { flex:1 1 140px; } .x-pri-t { display:none; } .x-top .x-pri { min-width:44px; justify-content:center; }
        .x-pop { left:12px; right:12px; bottom:12px; width:auto; }
      }
    </style>
  </head>
  <body>

    <script>
      const P = { grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>', tv:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/>', cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>', box:'<path d="m3 7 9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>', key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>', wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>', check:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>', chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>' };

      const T = { sla:["ใบงานครบกำหนด SLA","#F87171"], pm:["PM ครบกำหนด","#60A5FA"], cal:["สอบเทียบ","#22D3EE"], war:["หมดประกัน","#FBBF24"], lic:["ไลเซนส์หมดอายุ","#A78BFA"], con:["สัญญาสิ้นสุด","#FB923C"], st:["ตรวจนับ","#34D399"], ret:["กำหนดคืน","#FDE047"], doc:["เอกสารหมดอายุ","#CBD5E1"], hol:["วันหยุด","#F472B6"] };
