    <style>
      .x-app,.x-modal,.x-drawer,.x-toast{--bg:#0A1024;--card:#0F1833;--card2:#131E3E;--line:rgba(88,140,255,.28);--line2:rgba(150,170,230,.14);--tx:#E8EDFF;--tx2:#97A3C8;--glow:0 0 0 1px rgba(88,140,255,.06),0 0 22px -8px rgba(70,125,255,.55);--ok:#34D399;--warn:#FBBF24;--bad:#F87171;--info:#60A5FA;color:var(--tx);font:var(--type-small)}
      .x-modal button,.x-modal input,.x-modal select,.x-modal textarea,.x-drawer button{font:inherit;color:inherit}
      .x-modal .x-btn,.x-drawer .x-btn,.x-modal .x-tabs button{font:var(--type-label)}

      .x-logo b{display:block;font:var(--type-body-strong);letter-spacing:.02em}.x-logo small{color:var(--tx2);font-size:var(--size-caption)}
      .x-grp p{margin:0 8px 6px;color:var(--tx2);font:var(--type-tag);letter-spacing:.04em}

      .x-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;box-shadow:var(--glow)}

      .x-table tbody tr:hover{background:rgba(88,140,255,.07)}
      .x-table tbody tr:last-child td{border-bottom:0}

      .x-route{display:flex;align-items:center;gap:10px}
      .x-route svg{flex:none}.x-route .flow{stroke-dasharray:4 4;animation:x-flow 1s linear infinite}
      @keyframes x-flow{to{stroke-dashoffset:-8}}
      .x-note{display:inline-block;margin-top:4px;color:var(--warn);font-size:var(--size-caption)}
      .x-st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:var(--type-tag);white-space:nowrap;border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}

      .s-warn{color:var(--warn)}.s-ok{color:var(--ok)}.s-info{color:var(--info)}.s-bad{color:var(--bad)}.s-mute{color:var(--tx2)}

      .x-empty{padding:40px;text-align:center;color:var(--tx2)}

      .x-scrim.on{opacity:1;pointer-events:auto}
      .x-drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:21;border-radius:16px 0 0 16px;transform:translateX(105%);transition:transform .3s var(--ease-out);overflow:auto;padding:22px;display:grid;gap:18px;align-content:start}
      .x-drawer.on{transform:none}
      .x-dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.x-dh h2{font:var(--type-heading)}
      .x-dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0}.x-dl dt{color:var(--tx2)}.x-dl dd{margin:0}
      .x-h3{font:var(--type-label);color:var(--tx2);margin-bottom:10px}
      .x-steps{list-style:none;margin:0;padding:0}
      .x-steps li{position:relative;display:flex;gap:12px;padding-bottom:16px}
      .x-steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line2)}
      .x-steps li.done:not(:last-child)::after{background:linear-gradient(var(--ok),rgba(52,211,153,.3))}
      .x-steps i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font:var(--type-tag);font-style:normal;border:1px solid var(--line);background:var(--card)}
      .x-steps .done i{background:linear-gradient(135deg,#10B981,#14B8A6);border:0;color:#fff}
      .x-steps .cur i{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 4px rgba(251,191,36,.15);animation:x-pulse 1.6s ease-in-out infinite}
      .x-steps .rej i{background:var(--bad);border:0;color:#fff}
      @keyframes x-pulse{50%{box-shadow:0 0 0 8px rgba(251,191,36,0)}}
      .x-hist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
      .x-hist li{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line2)}
      .x-warnbox{padding:10px 12px;border-radius:12px;border:1px dashed rgba(251,191,36,.5);color:var(--warn)}
      .x-modal{position:fixed;left:50%;top:50%;width:min(720px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;z-index:21;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:all .25s var(--ease-out);padding:22px;display:grid;gap:16px}
      .x-modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
      .x-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
      .x-fs{border:1px solid var(--line2);border-radius:14px;padding:12px;display:grid;gap:8px;margin:0}
      .x-fs legend{color:var(--tx2);font:var(--type-tag);padding:0 6px}
      .x-lbl{display:grid;gap:6px;color:var(--tx2);font:var(--type-tag)}
      .x-lbl textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:70px;resize:vertical;color:var(--tx)}
      .x-pick{display:flex;flex-wrap:wrap;gap:6px}
      .x-pick label{cursor:pointer}.x-pick input{position:absolute;opacity:0}
      .x-pick span{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2)}
      .x-pick input:checked+span{border-color:#6EA0FF;color:var(--tx);background:rgba(88,140,255,.18)}
      .x-pick input:focus-visible+span{outline:2px solid #6EA0FF}
      .x-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
      .x-toast{position:fixed;right:20px;bottom:20px;z-index:30;padding:12px 16px;display:flex;gap:10px;align-items:center;transform:translateY(20px);opacity:0;transition:all .25s var(--ease-out);pointer-events:none}
      .x-toast.on{transform:none;opacity:1}
      [hidden]{display:none!important}
      @media (max-width:960px){.x-app{grid-template-columns:1fr}.x-side,.x-hide-m{display:none}.x-kpis{grid-template-columns:1fr}.x-grid2{grid-template-columns:1fr}.x-top,.x-content{padding-inline:14px}}
      @media (prefers-reduced-motion:reduce){.x-route .flow,.x-steps .cur i{animation:none}}
    </style>
  </head>

          <div>${pill(s)}</div><dl class="x-dl">${info.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>
          <div><p class="x-h3">ลำดับการอนุมัติ</p><ol class="x-steps">${steps}</ol></div>
          ${r.by === ME && pending(r, t) ? `<p class="x-warnbox">คุณเป็นผู้ขอรายการนี้ จึงอนุมัติเองไม่ได้ · รอผู้อนุมัติคนอื่น</p>` : ""}
          <div><p class="x-h3">ประวัติ</p><ul class="x-hist">${r.hist.slice().reverse().map((h) => `<li>${h.what}<span class="x-sub">${h.at}</span></li>`).join("")}</ul></div>
          <div>${acts(r, t)}</div>`;
        if (!dr.classList.contains("on")) { lastFocus = document.activeElement; dr.classList.add("on"); scrim.classList.add("on"); dr.setAttribute("aria-hidden", "false"); dr.querySelector("[data-close]").focus(); }
      }
      function closeAll() {
        openId = null;
        [dr, md, scrim].forEach((e) => e.classList.remove("on"));
        dr.setAttribute("aria-hidden", "true"); md.setAttribute("aria-hidden", "true");
        if (lastFocus) lastFocus.focus();
      }

      const siteSel = (n) => `<label class="x-field"><select name="${n}" aria-label="ไซต์"><option value="">— เลือกไซต์ —</option>${SITES.map((s) => `<option>${s}</option>`).join("")}</select></label>`;
      const inp = (n, ph, type = "text") => `<label class="x-field"><input name="${n}" type="${type}" placeholder="${ph}" aria-label="${ph}" /></label>`;
      function openModal() {
        lastFocus = document.activeElement;
        md.innerHTML = `<div class="x-dh"><h2 id="mt">สร้างรายการเคลื่อนไหว</h2><button type="button" class="x-btn x-icon-btn" data-close aria-label="ปิด">${ic("x")}</button></div>
          <div class="x-tabs" role="radiogroup" aria-label="ประเภท" id="mtype">${Object.entries({ t: "โอนย้าย", l: "ยืม-คืน", d: "จำหน่าย" }).map(([k, v]) => `<button type="button" role="radio" data-t="${k}">${v}</button>`).join("")}</div>
          <div class="x-lbl">ทรัพย์สิน (เลือกได้หลายรายการ)<div class="x-pick">${Object.entries(A).map(([k, v]) => `<label><input type="checkbox" name="a" value="${k}" /><span>${k} · ${v}</span></label>`).join("")}</div></div>
          <div class="x-grid2">
            <fieldset class="x-fs" data-for="t l d"><legend>จาก</legend>${siteSel("fsite")}${inp("floc", "ที่ตั้ง เช่น ฝ่ายIT")}${inp("fwho", "ผู้รับผิดชอบ")}</fieldset>
            <fieldset class="x-fs" data-for="t l"><legend>ไป</legend>${siteSel("tsite")}${inp("tloc", "ที่ตั้ง / แผนก")}${inp("twho", "ผู้รับผิดชอบ / ผู้ยืม")}</fieldset>
            <fieldset class="x-fs" data-for="d"><legend>การจำหน่าย</legend><label class="x-field"><select name="method" aria-label="วิธีจำหน่าย"><option value="">— วิธีจำหน่าย —</option><option>ขาย</option><option>บริจาค</option><option>ทำลาย</option></select></label>${inp("nbv", "NBV (บาท)", "number")}${inp("price", "ราคาขาย (บาท)", "number")}</fieldset>
          </div>
          <div class="x-grid2"><label class="x-lbl">วันที่<span class="x-field"><input type="date" name="date" aria-label="วันที่" /></span></label><label class="x-lbl" data-for="l">กำหนดคืน<span class="x-field"><input type="date" name="due" aria-label="กำหนดคืน" /></span></label></div>
          <label class="x-lbl">เหตุผล<textarea name="reason" placeholder="ระบุเหตุผลของการเคลื่อนไหว"></textarea></label>
          <div class="x-grid2" id="extra"></div>
          <div class="x-foot"><button type="button" class="x-btn" id="addf">${ic("plus")}เพิ่มฟิลด์</button><div class="x-acts"><button type="button" class="x-btn" data-close>ยกเลิก</button><button type="submit" class="x-btn x-btn--pri">${ic("check")}บันทึก</button></div></div>`;
        setType(tab);
        md.classList.add("on"); scrim.classList.add("on"); md.setAttribute("aria-hidden", "false");
        md.querySelector("#mtype button[aria-checked=true]").focus();
      }
      function setType(t) {
        md.dataset.type = t;
        md.querySelectorAll("#mtype button").forEach((b) => b.setAttribute("aria-checked", b.dataset.t === t));
        md.querySelectorAll("[data-for]").forEach((el) => (el.hidden = !el.dataset.for.split(" ").includes(t)));
      }
      md.addEventListener("click", (e) => {
        const tb = e.target.closest("#mtype button"); if (tb) setType(tb.dataset.t);
        if (e.target.closest("[data-close]")) closeAll();
        if (e.target.closest("#addf")) {
          const n = md.querySelectorAll("#extra .x-field").length / 2 + 1;
          md.querySelector("#extra").insertAdjacentHTML("beforeend", inp("xk" + n, `ชื่อฟิลด์ ${n}`) + inp("xv" + n, "ค่า"));
          md.querySelector(`[name=xk${n}]`).focus();
        }
      });
      md.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(md), g = (k) => (f.get(k) || "").trim(), t = md.dataset.type, tags = f.getAll("a");
        md.querySelectorAll(".x-ferr").forEach((n) => n.remove()); md.querySelectorAll("[aria-invalid]").forEach((n) => { n.removeAttribute("aria-invalid"); n.style.borderColor = ""; });
        const errs = [];
        if (!tags.length) errs.push([".x-pick", "เลือกทรัพย์สินอย่างน้อย 1 รายการ"]);
        if (!g("fsite")) errs.push(["[name=fsite]", "กรุณาเลือกไซต์ต้นทาง"]);
        if (t === "t") { if (!g("tsite")) errs.push(["[name=tsite]", "กรุณาเลือกไซต์ปลายทาง"]); if (!g("tloc")) errs.push(["[name=tloc]", "กรุณาระบุที่ตั้งปลายทาง"]); }
        if (t === "l") { if (!g("twho")) errs.push(["[name=twho]", "กรุณาระบุผู้ยืม"]); if (!g("due")) errs.push(["[name=due]", "กรุณาระบุกำหนดคืน"]); else if (g("date") && g("due") < g("date")) errs.push(["[name=due]", "กำหนดคืนต้องไม่ก่อนวันที่ยืม"]); }
        if (t === "d") { if (!g("method")) errs.push(["[name=method]", "กรุณาเลือกวิธีจำหน่าย"]); if (g("nbv") === "") errs.push(["[name=nbv]", "กรุณาระบุ NBV"]); if (g("method") === "ขาย" && g("price") === "") errs.push(["[name=price]", "กรุณาระบุราคาขาย"]); }
        if (!g("date")) errs.push(["[name=date]", "กรุณาระบุวันที่"]);
        if (!g("reason")) errs.push(["[name=reason]", "กรุณาระบุเหตุผล"]);
        if (errs.length) {
          errs.forEach(([q, m]) => { const el = md.querySelector(q); if (!el) return; el.setAttribute("aria-invalid", "true"); el.style.borderColor = "var(--bad)"; const box = el.closest(".x-field") || el; const d = document.createElement("span"); d.className = "x-ferr"; d.style.cssText = "display:block;color:var(--bad);font-size:12px;margin-top:4px"; d.textContent = m; box.after(d); });
          const first = md.querySelector(errs[0][0]); const fi = first.matches("input,select,textarea") ? first : first.querySelector("input"); fi && fi.focus(); first.scrollIntoView({ block: "center" });
          return;
        }
        const extra = [...f.keys()].filter((k) => /^xk/.test(k) && g(k)).map((k) => `${g(k)}: ${g("xv" + k.slice(2))}`).join(" · ");
        const id = `${{ t: "TRF", l: "LON", d: "DSP" }[t]}-2569-${String(NEXT[t]++).padStart(4, "0")}`;
        const base = { id, tags, date: g("date") || TODAY, by: ME, s: 1, reason: [g("reason"), extra].filter(Boolean).join(" · ") };
        let r;
        if (t === "t") r = tr({ ...base, from: [g("fsite"), g("floc") || "ไม่ระบุ", g("fwho") || "—"], to: [g("tsite"), g("tloc") || "ไม่ระบุ", g("twho") || "—"] });
        else if (t === "l") r = { ...base, by: g("twho") || ME, dept: g("tloc") || "ไม่ระบุ", site: g("fsite"), due: g("due") || TODAY, steps: LS, s: 3 };
        else r = { ...base, method: g("method"), nbv: +g("nbv") || 0, price: +g("price") || 0, site: g("fsite"), steps: DS };
        r.hist = [{ at: stamp(), what: `${ME} สร้างรายการ${t === "l" ? "ยืม" : "คำขอ"}` }];
        D[t].unshift(r);
        closeAll(); setTab(t);
        toast(`บันทึก ${id} แล้ว · ${status(r, t)}`);
      });
      $("#pri").addEventListener("click", openModal);

      $("#tb").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-act]"); if (b) return act(b.dataset.act, b.dataset.id);
        const tr = e.target.closest("tr[data-id]"); if (tr) drawer(tr.dataset.id);
      });
      $("#tb").addEventListener("keydown", (e) => { const tr = e.target.closest("tr[data-id]"); if (e.key === "Enter" && tr && e.target === tr) drawer(tr.dataset.id); });
      dr.addEventListener("click", (e) => { const b = e.target.closest("button[data-act]"); if (b) act(b.dataset.act, b.dataset.id); if (e.target.closest("[data-close]")) closeAll(); });
      scrim.addEventListener("click", closeAll);
      $("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setTab(b.dataset.t); });
      ["#q", "#fst", "#site"].forEach((s) => $(s).addEventListener("input", render));
      $("#gsearch").addEventListener("input", (e) => { $("#q").value = e.target.value; render(); });
      $("#bell").addEventListener("click", (e) => {
        const n = D.t.filter((r) => /^รอ/.test(status(r, "t"))).length + D.l.filter((r) => status(r, "l") === "เกินกำหนดคืน").length;
        e.currentTarget.querySelector(".x-dot")?.remove();
        toast(`แจ้งเตือน ${n} รายการ: รออนุมัติโอนย้าย และยืมเกินกำหนดคืน`);
      });
      $("#fix").addEventListener("click", () => toast("เปิดฟอร์มแจ้งซ่อม (ตัวอย่าง)"));
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#gsearch").focus(); }
        if (e.key === "Escape") closeAll();
      });
      const NAV = [["ภาพรวม", [["grid", "แดชบอร์ด"], ["radar", "ศูนย์บัญชาการ"]]], ["ทรัพย์สิน", [["box", "ทะเบียนทรัพย์สิน"], ["swap", "โอนย้าย/ยืม-คืน/จำหน่าย", 1], ["scan", "ตรวจนับ"], ["trend", "ค่าเสื่อมราคา"]]], ["ซ่อมบำรุง", [["wrench", "ใบแจ้งซ่อม"], ["cal", "PM ตามแผน"], ["gauge", "สอบเทียบ"]]], ["คลัง & จัดซื้อ", [["store", "อะไหล่ & คลัง"], ["cart", "ใบขอซื้อ"]]], ["วิเคราะห์", [["chart", "รายงาน"], ["trend", "MTBF / MTTR"]]], ["ระบบ", [["users", "ผู้ใช้ & สิทธิ์"], ["gear", "ตั้งค่า"]]]];
      $("#side").innerHTML = NAV.map(([g, items]) => `<div><p>${g}</p>${items.map(([i, l, on]) => `<a href="#top"${on ? ' aria-current="page"' : ""}>${ic(i)}${l}</a>`).join("")}</div>`).join("");
      setTab("t");
    </script>
      <script src="../../assets/site-nav.js"></script>
</body>
</html>
